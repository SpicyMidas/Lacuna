modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
# Where players report problems
issueTrackerURL="https://github.com/SpicyMidas/Lacuna/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Created by SpicyMidas. Built with NeoForge."
displayURL="https://github.com/SpicyMidas/Lacuna"
# Pixel art at the jar root (tools/art/m20_logo.py); no blur so the pixels stay crisp in the Mods screen
logoFile="lacuna_logo.png"
logoBlur=false
description='''${mod_description}'''
enumExtensions="META-INF/enumextensions.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
